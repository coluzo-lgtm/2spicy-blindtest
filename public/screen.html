<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2 Spicy — Écran</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; height: 100%;
    background: #F60097;
    color: #ffffff;
    font-family: 'Anton', 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .top {
    text-align: center;
    padding: 3vh 0 1vh;
  }
  .logo-img {
    max-height: 12vh;
    max-width: 60vw;
  }
  .round {
    font-size: 2vw;
    color: #ffe3f4;
    margin-top: 0.5vh;
    font-weight: 700;
  }
  .layout {
    display: flex;
    height: 76vh;
    padding: 0 4vw;
    gap: 3vw;
  }
  .board {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 1.4vh;
    justify-content: center;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 1.5vw;
    background: rgba(16,31,222,0.28);
    border: 1px solid rgba(16,31,222,0.7);
    border-radius: 16px;
    padding: 1.2vh 2vw;
    transition: all 0.4s ease;
  }
  .row.locked { opacity: 0.45; }
  .rank { font-size: 2vw; font-weight: 900; width: 3vw; color: #FCFA0B; }
  .dot { width: 2vw; height: 2vw; border-radius: 50%; flex-shrink: 0; }
  .name { font-size: 2.4vw; font-weight: 700; flex: 1; }
  .lock { font-size: 1.6vw; }
  .score { font-size: 2.8vw; font-weight: 900; min-width: 4vw; text-align: right; color: #FCFA0B; }
  .bump { animation: bump 0.6s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    30% { transform: scale(1.06); box-shadow: 0 0 40px rgba(16,31,222,0.7); }
    100% { transform: scale(1); }
  }
  .queue-panel {
    flex: 1;
    background: rgba(16,31,222,0.35);
    border: 2px solid #101FDE;
    border-radius: 20px;
    padding: 2vh 1.5vw;
    display: flex;
    flex-direction: column;
  }
  .queue-title {
    font-size: 1.6vw;
    color: #FCFA0B;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 1.5vh;
    text-align: center;
    font-weight: 800;
  }
  .queue-empty {
    color: #ffcdea;
    text-align: center;
    margin-top: 4vh;
    font-size: 1.4vw;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 1vw;
    padding: 1.2vh 1vw;
    border-radius: 12px;
    margin-bottom: 1vh;
    font-size: 1.8vw;
    font-weight: 700;
  }
  .queue-item.first {
    background: linear-gradient(90deg, rgba(252,250,11,0.4), rgba(16,31,222,0.35));
    box-shadow: 0 0 30px rgba(252,250,11,0.4);
    font-size: 2.2vw;
  }
  .queue-item:not(.first) { background: rgba(16,31,222,0.2); opacity: 0.85; }
  .queue-pos { color: #FCFA0B; width: 1.5vw; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo-img" src="2.png" alt="2 Spicy Blind Test" />
    <div class="round" id="roundLabel">Manche 1</div>
  </div>
  <div class="layout">
    <div class="board" id="board"></div>
    <div class="queue-panel">
      <div class="queue-title">Qui a buzzé ?</div>
      <div id="queueList"></div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const board = document.getElementById('board');
const queueList = document.getElementById('queueList');
const roundLabel = document.getElementById('roundLabel');
let prevScores = {};

socket.on('state', (state) => {
  roundLabel.textContent = 'Manche ' + state.round;

  const sorted = Object.values(state.teams).sort((a, b) => b.score - a.score);
  board.innerHTML = sorted.map((t, i) => {
    const bumped = prevScores[t.id] !== undefined && prevScores[t.id] !== t.score;
    return `
      <div class="row ${t.locked ? 'locked' : ''} ${bumped ? 'bump' : ''}">
        <div class="rank">#${i + 1}</div>
        <div class="dot" style="background:${t.color}"></div>
        <div class="name">${t.name}</div>
        ${t.locked ? '<div class="lock">🔒</div>' : ''}
        <div class="score">${t.score}</div>
      </div>
    `;
  }).join('');

  sorted.forEach(t => { prevScores[t.id] = t.score; });

  if (!state.queue.length) {
    queueList.innerHTML = '<div class="queue-empty">En attente des buzz...</div>';
  } else {
    queueList.innerHTML = state.queue.map((q, i) => {
      const team = state.teams[q.teamId];
      if (!team) return '';
      return `
        <div class="queue-item ${i === 0 ? 'first' : ''}">
          <span class="queue-pos">${i + 1}</span>
          <span class="dot" style="background:${team.color}"></span>
          <span>${team.name}</span>
        </div>
      `;
    }).join('');
  }
});
</script>
</body>
</html>
